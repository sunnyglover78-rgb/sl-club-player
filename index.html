
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}

#player {
  position: absolute;
  width: 200%;
  height: 200%;
  left: -50%;
  top: -50%;
  overflow: hidden;
}

/* Statusanzeige vollständig ausblenden */
#status {
  display: none;
}
</style>
</head>

<body>

<div id="player"></div>
<div id="status"></div>

<script>
const params = new URLSearchParams(window.location.search);

const videos = (
  params.get("list") ||
  "jaDHR5LXM9c,HxBRIT4dQVI,t4PCLxQKR1I"
)
.split(",")
.map(v => v.trim())
.filter(v => /^[A-Za-z0-9_-]{11}$/.test(v));

let current = 0;
let player = null;
let switching = false;
let lastTime = 0;

function status(text) {
  document.getElementById("status").textContent = text;
}

function nextVideo() {
  if (!player || switching || videos.length === 0) return;

  switching = true;
  current = (current + 1) % videos.length;
  lastTime = 0;

  status("Wechsel zu Video " + (current + 1));
  player.loadVideoById(videos[current]);

  setTimeout(function() {
    switching = false;
  }, 1500);
}

function onYouTubeIframeAPIReady() {
  if (videos.length === 0) return;

  player = new YT.Player("player", {
    width: "100%",
    height: "100%",
    videoId: videos[0],

    playerVars: {
      autoplay: 1,
      controls: 0,
      playsinline: 1,
      rel: 0,
      origin: window.location.origin
    },

    events: {
      onReady: function(e) {
        e.target.playVideo();
      },

      onStateChange: function(e) {
        if (e.data === YT.PlayerState.ENDED) {
          nextVideo();
        }
      },

      onError: function(e) {
        status("YouTube Fehler " + e.data);
      }
    }
  });
}

setInterval(function() {
  if (!player || switching) return;

  const duration = player.getDuration();
  const time = player.getCurrentTime();
  const state = player.getPlayerState();

  if (!duration || !Number.isFinite(time)) return;

  if (time > 0 && duration - time < 0.8) {
    nextVideo();
    return;
  }

  if (
    state === YT.PlayerState.PLAYING &&
    lastTime > 2 &&
    time < lastTime - 2
  ) {
    nextVideo();
    return;
  }

  lastTime = time;
}, 250);

const script = document.createElement("script");
script.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(script);
</script>

</body>
</html>

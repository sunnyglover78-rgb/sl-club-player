
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SL Club Video Player</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#player {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: translate(-50%, -50%) scale(1.12);
    background: black;
}

#startButton {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 18px 30px;
    font-size: 22px;
    color: white;
    background: #222;
    border: 2px solid white;
    cursor: pointer;
    z-index: 10;
}

#error {
    position: absolute;
    bottom: 15px;
    left: 15px;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    z-index: 5;
}
</style>
</head>

<body>

<video id="player" autoplay muted playsinline preload="auto"></video>

<button id="startButton">▶ VIDEO STARTEN</button>
<div id="error"></div>

<script>
const playlist = [
    "video1.mp4",
    "video2.mp4",
    "video3.mp4",
    "video4.mp4"
];

const player = document.getElementById("player");
const startButton = document.getElementById("startButton");
const errorBox = document.getElementById("error");

let durations = [];
let currentIndex = -1;
let switching = false;

function getDuration(file) {
    return new Promise((resolve, reject) => {
        const video = document.createElement("video");
        video.preload = "metadata";

        video.onloadedmetadata = () => {
            const duration = video.duration;
            video.removeAttribute("src");
            video.load();

            if (Number.isFinite(duration) && duration > 0) {
                resolve(duration);
            } else {
                reject("Ungültige Videodauer: " + file);
            }
        };

        video.onerror = () => {
            reject("Video kann nicht geladen werden: " + file);
        };

        video.src = file;
    });
}

function getTarget() {
    const total = durations.reduce((a, b) => a + b, 0);
    let time = (Date.now() / 1000) % total;

    for (let i = 0; i < durations.length; i++) {
        if (time < durations[i]) {
            return { index: i, time: time };
        }
        time -= durations[i];
    }

    return { index: 0, time: 0 };
}

function showStartButton() {
    startButton.style.display = "block";
}

function tryPlay() {
    const promise = player.play();

    if (promise && typeof promise.catch === "function") {
        promise.then(() => {
            startButton.style.display = "none";
        }).catch(showStartButton);
    }
}

function synchronize() {
    if (!durations.length || switching) return;

    const target = getTarget();

    if (currentIndex !== target.index) {
        switching = true;
        currentIndex = target.index;

        player.onloadedmetadata = () => {
            const updated = getTarget();

            if (updated.index !== currentIndex) {
                switching = false;
                synchronize();
                return;
            }

            try {
                player.currentTime = Math.max(0, updated.time);
            } catch (e) {}

            switching = false;
            tryPlay();
        };

        player.src = playlist[target.index];
        player.load();
        return;
    }

    if (player.readyState >= 1) {
        if (Math.abs(player.currentTime - target.time) > 0.5) {
            try {
                player.currentTime = target.time;
            } catch (e) {}
        }

        if (player.paused) {
            tryPlay();
        }
    }
}

startButton.addEventListener("click", () => {
    startButton.style.display = "none";
    synchronize();
    tryPlay();
});

player.addEventListener("error", () => {
    errorBox.textContent =
        "Fehler beim Abspielen: " + playlist[currentIndex];
});

async function initialize() {
    try {
        for (const file of playlist) {
            durations.push(await getDuration(file));
        }

        errorBox.textContent = "";
        synchronize();
        setInterval(synchronize, 1000);

    } catch (error) {
        errorBox.textContent = error;
    }
}

initialize();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>SL Club MEGA Player</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}
iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
#next {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 10;
  background: rgba(0,0,0,.8);
  color: white;
  border: 1px solid #777;
  padding: 12px 18px;
  cursor: pointer;
}
#message {
  color: white;
  padding: 20px;
}
</style>
</head>
<body>

<div id="message"></div>
<iframe id="player"
  allow="autoplay; fullscreen; encrypted-media"
  allowfullscreen>
</iframe>

<button id="next" onclick="nextVideo()">
  Nächstes Video ▶
</button>

<script>
const params = new URLSearchParams(location.search);

const videos = (params.get("list") || "")
  .split("|")
  .map(v => v.trim())
  .filter(v =>
    /^https:\/\/mega\.nz\/(file|embed)\/[A-Za-z0-9_-]+#[A-Za-z0-9_-]+$/.test(v)
  )
  .map(v => v.replace("/file/", "/embed/"));

let current = 0;

const frame = document.getElementById("player");
const message = document.getElementById("message");

function playVideo() {
  if (!videos.length) {
    frame.style.display = "none";
    message.textContent = "Keine MEGA-Videos vorhanden";
    return;
  }

  message.textContent = "";
  frame.src = videos[current];
}

function nextVideo() {
  if (!videos.length) return;
  current = (current + 1) % videos.length;
  playVideo();
}

playVideo();
</script>
</body>
</html>

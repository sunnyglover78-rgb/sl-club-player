
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Club Video Player</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}
video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: black;
}
#start {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 15px 25px;
  font-size: 20px;
  color: gold;
  background: #111;
  border: 2px solid gold;
  cursor: pointer;
}
#status {
  position: fixed;
  bottom: 10px;
  left: 10px;
  color: white;
  background: #0009;
  padding: 6px;
  font-size: 13px;
}
</style>
</head>
<body>

<video id="player" autoplay muted playsinline preload="auto"></video>
<button id="start" hidden>▶ Video starten</button>
<div id="status" hidden></div>

<script>
"use strict";

const playlist = [
  "video1.mp4",
  "video2.mp4",
  "video3.mp4",
  "video4.mp4",
  "video5.mp4",
  "video6.mp4"
];

// Die tatsächlichen Videolängen werden ermittelt.
const durations = [];
const player = document.getElementById("player");
const start = document.getElementById("start");
const status = document.getElementById("status");

let index = -1;
let loading = false;
let ready = false;
let requestId = 0;
let blocked = false;

function showError(message) {
  status.hidden = false;
  status.textContent = message;
}

async function getDuration(file) {
  return new Promise((resolve, reject) => {
    const video = document.createElement("video");
    video.preload = "metadata";
    video.onloadedmetadata = () => {
      const d = video.duration;
      if (Number.isFinite(d) && d > 0) {
        resolve(d);
      } else {
        reject(new Error("Ungültige Videolänge: " + file));
      }
    };
    video.onerror = () => reject(
      new Error("Video nicht gefunden: " + file)
    );
    video.src = file;
  });
}

function targetPosition() {
  const total = durations.reduce((a, b) => a + b, 0);
  let elapsed = (Date.now() / 1000) % total;

  for (let i = 0; i < durations.length; i++) {
    if (elapsed < durations[i]) {
      return { index: i, seconds: elapsed };
    }
    elapsed -= durations[i];
  }

  return { index: 0, seconds: 0 };
}

async function playVideo() {
  try {
    await player.play();
    blocked = false;
    start.hidden = true;
  } catch (e) {
    blocked = true;
    start.hidden = false;
  }
}

function syncPlayer() {
  if (!ready) return;

  const target = targetPosition();

  if (target.index !== index) {
    index = target.index;
    loading = true;
    const id = ++requestId;

    player.src = playlist[index];
    player.load();

    player.onloadedmetadata = () => {
      if (id !== requestId) return;

      const current = targetPosition();

      if (current.index !== index) {
        loading = false;
        syncPlayer();
        return;
      }

      player.currentTime = Math.min(
        current.seconds,
        Math.max(0, player.duration - 0.1)
      );

      loading = false;
      playVideo();
    };
    return;
  }

  if (loading || player.readyState < 1) return;

  const drift = Math.abs(
    player.currentTime - target.seconds
  );

  if (drift > 0.8) {
    player.currentTime = Math.min(
      target.seconds,
      Math.max(0, player.duration - 0.1)
    );
  }

  if (player.paused && !blocked) {
    playVideo();
  }
}

player.onerror = () => {
  showError("Fehler beim Laden: " + playlist[index]);
};

start.onclick = () => {
  blocked = false;
  syncPlayer();
  playVideo();
};

player.onended = syncPlayer;

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) syncPlayer();
});

async function init() {
  try {
    for (const file of playlist) {
      durations.push(await getDuration(file));
    }

    ready = true;
    status.hidden = true;
    syncPlayer();
    setInterval(syncPlayer, 2000);
  } catch (e) {
    showError(e.message);
    console.error(e);
  }
}

init();
</script>
</body>
</html>

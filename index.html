
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Club Player – 6 Videos Sync</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

#message {
  position: fixed;
  bottom: 10px;
  left: 10px;
  color: white;
  background: rgba(0,0,0,0.7);
  padding: 8px;
  font: 14px Arial, sans-serif;
}

#start {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 24px;
  background: #222;
  color: white;
  border: 2px solid white;
  font: 20px Arial, sans-serif;
}
</style>
</head>

<body>

<video
  id="player"
  autoplay
  muted
  playsinline
  preload="auto">
</video>

<div id="message">Videos werden geladen...</div>
<button id="start" hidden>▶ Starten</button>

<script>
"use strict";

// Alle Videos liegen neben der index.html.
const playlist = [
  "video1.mp4",
  "video2.mp4",
  "video3.mp4",
  "video4.mp4",
  "video5.mp4",
  "video6.mp4"
];

const player = document.getElementById("player");
const message = document.getElementById("message");
const startButton = document.getElementById("start");

const durations = [];

let ready = false;
let currentIndex = -1;
let loadToken = 0;
let blocked = false;

// Videolänge automatisch erkennen.
function readDuration(file) {
  return new Promise((resolve, reject) => {
    const probe = document.createElement("video");
    probe.preload = "metadata";

    probe.onloadedmetadata = () => {
      const duration = probe.duration;

      if (Number.isFinite(duration) && duration > 0) {
        probe.removeAttribute("src");
        probe.load();
        resolve(duration);
      } else {
        reject(new Error("Ungültige Länge: " + file));
      }
    };

    probe.onerror = () => {
      reject(new Error("Datei nicht ladbar: " + file));
    };

    probe.src = file;
  });
}

// Gemeinsame Zeitachse für alle Bildschirme.
function getTarget() {
  const total = durations.reduce((a, b) => a + b, 0);

  let position = (Date.now() / 1000) % total;

  for (let i = 0; i < durations.length; i++) {
    if (position < durations[i]) {
      return {
        index: i,
        time: position
      };
    }

    position -= durations[i];
  }

  return { index: 0, time: 0 };
}

// Wiedergabe starten.
async function tryPlay() {
  try {
    await player.play();
    blocked = false;
    startButton.hidden = true;
  } catch (error) {
    blocked = true;
    startButton.hidden = false;
  }
}

// Synchronisierung.
function synchronize() {
  if (!ready) return;

  const target = getTarget();

  // Anderes Video erforderlich.
  if (target.index !== currentIndex) {
    currentIndex = target.index;
    const token = ++loadToken;

    message.hidden = false;
    message.textContent =
      "Lade " + playlist[currentIndex];

    player.onloadedmetadata = () => {
      if (token !== loadToken) return;

      const latest = getTarget();

      // Falls inzwischen ein anderes Video dran ist.
      if (latest.index !== currentIndex) {
        synchronize();
        return;
      }

      player.currentTime = Math.min(
        latest.time,
        Math.max(0, player.duration - 0.1)
      );

      message.hidden = true;
      tryPlay();
    };

    player.src = playlist[currentIndex];
    player.load();
    return;
  }

  if (player.readyState < 1) return;

  const difference = Math.abs(
    player.currentTime - target.time
  );

  // Abweichung über 0,5 Sekunden korrigieren.
  if (difference > 0.5) {
    player.currentTime = Math.min(
      target.time,
      Math.max(0, player.duration - 0.1)
    );
  }

  if (player.paused && !blocked) {
    tryPlay();
  }
}

// Manuell starten, falls Autoplay blockiert wird.
startButton.onclick = () => {
  blocked = false;
  tryPlay();
};

player.onended = synchronize;

player.onerror = () => {
  message.hidden = false;
  message.textContent =
    "Fehler beim Laden von " + playlist[currentIndex];
};

// Videos vorbereiten.
async function initialize() {
  try {
    for (const file of playlist) {
      message.textContent = "Prüfe " + file;
      const duration = await readDuration(file);
      durations.push(duration);
    }

    ready = true;
    message.hidden = true;

    synchronize();

    setInterval(synchronize, 2000);

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) synchronize();
      }
    );

  } catch (error) {
    message.hidden = false;
    message.textContent = error.message;
    console.error(error);
  }
}

initialize();
</script>

</body>
</html>

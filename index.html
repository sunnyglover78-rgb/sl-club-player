
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>SL DJ Synchron Player</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

#player {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: black;
}

#start {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 20;
  padding: 14px 22px;
  font-size: 18px;
  color: #D4AF37;
  background: #111;
  border: 2px solid #D4AF37;
  border-radius: 6px;
}

#start[hidden] { display: none; }
</style>
</head>

<body>

<video id="player"
       autoplay
       playsinline
       preload="auto">
</video>

<button id="start" hidden>
  ▶ Wiedergabe starten
</button>

<script>
"use strict";

// Alle vier Videos sind 60 Sekunden lang.
const playlist = [
  "video1.mp4",
  "video2.mp4",
  "video3.mp4",
  "video4.mp4",
  "video5.mp4",
  "video6.mp4"
];

const VIDEO_SECONDS = 60;
const TOTAL_SECONDS =
  playlist.length * VIDEO_SECONDS;

// Fester gemeinsamer Startzeitpunkt.
// Auf allen Bildschirmen identisch.
const EPOCH_SECONDS = 0;

// Regelmaessige Synchronisationskontrolle.
const SYNC_INTERVAL_MS = 2000;
const MAX_DRIFT_SECONDS = 0.8;

const player = document.getElementById("player");
const start = document.getElementById("start");

let currentIndex = -1;
let loading = false;
let autoplayBlocked = false;

function targetPosition() {
  const now = Date.now() / 1000;

  const elapsed =
    ((now - EPOCH_SECONDS) % TOTAL_SECONDS
      + TOTAL_SECONDS) % TOTAL_SECONDS;

  return {
    index: Math.floor(elapsed / VIDEO_SECONDS),
    seconds: elapsed % VIDEO_SECONDS
  };
}

async function attemptPlay() {
  try {
    await player.play();
    autoplayBlocked = false;
    start.hidden = true;
  } catch (error) {
    autoplayBlocked = true;
    start.hidden = false;
  }
}

function seekTo(seconds) {
  if (player.readyState < 1) return;

  const duration = Number.isFinite(player.duration)
    ? player.duration
    : VIDEO_SECONDS;

  player.currentTime = Math.min(
    Math.max(0, seconds),
    Math.max(0, duration - 0.15)
  );
}

function loadVideo(index, seconds) {
  currentIndex = index;
  loading = true;

  player.src = playlist[index];
  player.load();

  player.addEventListener(
    "loadedmetadata",
    function onMetadata() {
      const target = targetPosition();

      if (target.index !== currentIndex) {
        loading = false;
        syncPlayer();
        return;
      }

      seekTo(target.seconds);
      loading = false;
      attemptPlay();
    },
    { once: true }
  );
}

function syncPlayer() {
  if (playlist.length === 0) return;

  const target = targetPosition();

  if (target.index !== currentIndex) {
    loadVideo(target.index, target.seconds);
    return;
  }

  if (loading || player.readyState < 1) {
    return;
  }

  const drift =
    Math.abs(player.currentTime - target.seconds);

  if (drift > MAX_DRIFT_SECONDS) {
    seekTo(target.seconds);
  }

  if (player.paused && !autoplayBlocked) {
    attemptPlay();
  }
}

player.addEventListener("ended", syncPlayer);

player.addEventListener("error", function() {
  console.error("MP4 konnte nicht geladen werden:",
                playlist[currentIndex]);
});

start.addEventListener("click", function() {
  syncPlayer();
  attemptPlay();
});

document.addEventListener(
  "visibilitychange",
  function() {
    if (!document.hidden) syncPlayer();
  }
);

syncPlayer();
setInterval(syncPlayer, SYNC_INTERVAL_MS);
</script>
</body>
</html>

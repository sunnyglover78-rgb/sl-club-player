
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1">
<title>SL Club MEGA Playlist</title>

<style>
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}
#player {
  position:absolute;
  width:100%;
  height:100%;
  border:0;
}
#status {
  position:fixed;
  top:10px;
  left:10px;
  z-index:10;
  padding:10px;
  background:rgba(0,0,0,.8);
  color:white;
  font-size:17px;
}
#next {
  position:fixed;
  right:10px;
  bottom:10px;
  z-index:10;
  padding:12px 20px;
  color:white;
  background:#222;
  border:1px solid #888;
  cursor:pointer;
}
</style>
</head>

<body>

<iframe id="player"
 allow="autoplay; fullscreen; encrypted-media"
 allowfullscreen>
</iframe>

<div id="status"></div>
<button id="next">NEXT ▶</button>

<script>
"use strict";

const params =
  new URLSearchParams(location.search);

const fallback = [
  {
    url: "https://mega.nz/embed/VM5AGDII#ElaIkT1PrvueW8huRDh1lbDeSYmXiy3XytGGZSfMIw4",
    duration: 15
  },
  {
    url: "https://mega.nz/embed/5ZBTjLZa#0uNGhsH-jMMhLjDkIaPo2hlShprMDoFw4wY2uoIW0yI",
    duration: 15
  }
];

const raw = params.get("list");

const videos = raw === null
  ? fallback
  : raw.split("|").map(entry => {
      const pos = entry.lastIndexOf("@");
      if (pos < 0) return null;

      const url = entry.slice(0,pos);
      const duration = Number(entry.slice(pos+1));

      if (
        !/^https:\/\/mega\.nz\/(file|embed)\/[A-Za-z0-9_-]+#[A-Za-z0-9_-]+$/.test(url)
        || !Number.isFinite(duration)
        || duration < 1
      ) return null;

      return {
        url: url.replace("/file/","/embed/"),
        duration: Math.floor(duration)
      };
    }).filter(Boolean);

const frame = document.getElementById("player");
const status = document.getElementById("status");

let current = 0;
let timer = null;
let interval = null;
let endTime = 0;

function showStatus() {
  const seconds = Math.max(
    0,
    Math.ceil((endTime-Date.now())/1000)
  );

  status.textContent =
    "Video " + (current+1) +
    " / " + videos.length +
    " | Wechsel in " + seconds + "s";
}

function playVideo() {
  clearTimeout(timer);
  clearInterval(interval);

  if (!videos.length) {
    status.textContent = "Keine Videos vorhanden";
    return;
  }

  const video = videos[current];

  // MEGA-Link nicht veraendern
  frame.src = video.url;

  endTime = Date.now() +
    video.duration * 1000;

  showStatus();

  interval = setInterval(showStatus, 500);

  timer = setTimeout(nextVideo,
    video.duration * 1000);
}

function nextVideo() {
  if (!videos.length) return;

  current = (current+1) % videos.length;
  playVideo();
}

document.getElementById("next")
  .addEventListener("click",nextVideo);

playVideo();
</script>
</body>
</html>

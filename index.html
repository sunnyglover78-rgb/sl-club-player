
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<meta name="referrer"
      content="strict-origin-when-cross-origin">
<title>SL Club Player Test</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

#status {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px;
    color: white;
    background: rgba(0,0,0,0.8);
    font: 16px Arial, sans-serif;
    z-index: 10;
    pointer-events: none;
}
</style>
</head>

<body>
<div id="player"></div>
<div id="status">Player wird geladen ...</div>

<script>
const params = new URLSearchParams(
    window.location.search
);

const videos = (
    params.get("list") || "M7lc1UVf-VE"
).split(",")
 .map(v => v.trim())
 .filter(v => /^[A-Za-z0-9_-]{11}$/.test(v));

let current = 0;
let player;
let switching = false;

function status(text) {
    document.getElementById("status").textContent =
        text;
}

function nextVideo() {
    if (!player || switching) return;

    switching = true;

    current = (current + 1) % videos.length;

    status("Wechsel zu Video " + (current + 1));

    player.loadVideoById(videos[current]);

    setTimeout(() => {
        switching = false;
    }, 2000);
}

function onYouTubeIframeAPIReady() {
    if (!videos.length) {
        status("Keine Videos gefunden");
        return;
    }

    status("API bereit - " + videos.length + " Videos");

    player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: videos[0],

        playerVars: {
            autoplay: 1,
            controls: 0,
            playsinline: 1,
            origin: window.location.origin
        },

        events: {
            onReady: function(event) {
                status("Video 1 bereit");
                event.target.playVideo();
            },

            onStateChange: function(event) {
                if (event.data === YT.PlayerState.PLAYING) {
                    status(
                        "Video " + (current + 1)
                        + " laeuft"
                    );
                }

                if (event.data === YT.PlayerState.ENDED) {
                    status("Video beendet - Wechsel");
                    nextVideo();
                }
            },

            onError: function(event) {
                status(
                    "YouTube Fehler " + event.data
                );
            },

            onAutoplayBlocked: function() {
                status("Autoplay blockiert");
            }
        }
    });
}

const script = document.createElement("script");
script.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(script);
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Club Player</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
}
video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: black;
}
#start {
  display: none;
  position: absolute;
  inset: 0;
  margin: auto;
  width: 220px;
  height: 65px;
  z-index: 2;
  cursor: pointer;
  font-size: 22px;
}
#status {
  position: absolute;
  bottom: 15px;
  left: 15px;
  color: white;
  font: 16px Arial;
}
</style>
</head>
<body>

<video id="player" playsinline></video>
<button id="start">▶ START</button>
<div id="status"></div>

<script>
const params = new URLSearchParams(location.search);

const videos = (params.get("list") || "")
  .split("|")
  .map(v => v.trim())
  .filter(v => /^https:\/\/.+/i.test(v));

const player = document.getElementById("player");
const start = document.getElementById("start");
const status = document.getElementById("status");

let current = 0;
let errors = 0;

function playVideo() {
  if (!videos.length) {
    status.textContent = "Keine MP4-Videos vorhanden";
    return;
  }

  player.src = videos[current];
  player.load();
  status.textContent = "";

  player.play().then(() => {
    start.style.display = "none";
    errors = 0;
  }).catch(() => {
    start.style.display = "block";
  });
}

function nextVideo() {
  current = (current + 1) % videos.length;
  playVideo();
}

player.addEventListener("ended", nextVideo);

player.addEventListener("error", () => {
  errors++;
  if (errors >= videos.length) {
    status.textContent = "Keine Videos abspielbar";
    return;
  }
  nextVideo();
});

start.addEventListener("click", () => {
  player.play().then(() => {
    start.style.display = "none";
  }).catch(() => {
    status.textContent = "Wiedergabe blockiert";
  });
});

playVideo();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<meta name="referrer"
      content="strict-origin-when-cross-origin">

<title>SL Club Video Wall</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}
</style>
</head>

<body>
<iframe
    id="player"
    title="Club Video"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; encrypted-media; fullscreen"
    allowfullscreen>
</iframe>

<script>
const params = new URLSearchParams(
    window.location.search
);

const validID = /^[A-Za-z0-9_-]{11}$/;

const requested = (
    params.get("list") || "M7lc1UVf-VE"
).split(",");

const ids = requested
    .map(id => id.trim())
    .filter(id => validID.test(id))
    .slice(0, 30);

if (ids.length > 0) {
    const url = new URL(
        "https://www.youtube.com/embed/" + ids[0]
    );

    url.searchParams.set("autoplay", "1");
    url.searchParams.set("controls", "0");
    url.searchParams.set("playsinline", "1");
    url.searchParams.set("loop", "1");
    url.searchParams.set("playlist", ids.join(","));

    document.getElementById("player").src =
        url.toString();
}
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>SL Club MEGA Auto Playlist</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

#next {
  position: fixed;
  right: 10px;
  bottom: 10px;
  z-index: 10;
  background: rgba(0,0,0,.8);
  color: white;
  border: 1px solid #888;
  padding: 12px;
  cursor: pointer;
}

#status {
  position: fixed;
  left: 10px;
  top: 10px;
  color: white;
  z-index: 10;
}
</style>
</head>

<body>

<div id="status"></div>

<iframe id="player"
  allow="autoplay; fullscreen; encrypted-media"
  allowfullscreen>
</iframe>

<button id="next" onclick="nextVideo()">
  NEXT ▶
</button>

<script>
const params = new URLSearchParams(location.search);

// Format:
// MEGA-LINK@SEKUNDEN
// Mehrere Einträge getrennt durch |

const entries = (params.get("list") || "")
  .split("|")
  .map(v => v.trim())
  .filter(Boolean);

const videos = entries.map(entry => {
  const pos = entry.lastIndexOf("@");

  if (pos === -1) return null;

  const url = entry.slice(0, pos);
  const seconds = Number(entry.slice(pos + 1));

  if (
    !/^https:\/\/mega\.nz\/(file|embed)\/[A-Za-z0-9_-]+#[A-Za-z0-9_-]+$/.test(url)
    || !Number.isFinite(seconds)
    || seconds < 1
  ) {
    return null;
  }

  return {
    url: url.replace("/file/", "/embed/"),
    duration: seconds
  };
}).filter(Boolean);

let current = 0;
let timer = null;

const frame = document.getElementById("player");
const status = document.getElementById("status");

function playVideo() {
  clearTimeout(timer);

  if (!videos.length) {
    status.textContent = "Keine Videos vorhanden";
    return;
  }

  const video = videos[current];

  frame.src = video.url;

  status.textContent =
    "Video " + (current + 1) +
    " / " + videos.length;

  timer = setTimeout(
    nextVideo,
    video.duration * 1000
  );
}

function nextVideo() {
  if (!videos.length) return;

  current = (current + 1) % videos.length;
  playVideo();
}

playVideo();
</script>

</body>
</html>

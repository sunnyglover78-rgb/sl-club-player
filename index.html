
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Second Life DJ MP4 Player</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}
video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
#start {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 16px 24px;
  font-size: 20px;
}
#status {
  position: fixed;
  top: 10px;
  left: 10px;
  color: white;
  background: rgba(0,0,0,.75);
  padding: 8px;
  font-family: Arial, sans-serif;
}
</style>
</head>
<body>

<video id="player" autoplay playsinline></video>
<div id="status">Player startet...</div>
<button id="start" hidden>▶ Start</button>

<script>
const playlist = [
  "video1.mp4",
  "video2.mp4"
];

const player = document.getElementById("player");
const status = document.getElementById("status");
const start = document.getElementById("start");

let current = 0;

async function playCurrent() {
  player.src = playlist[current];
  player.load();

  status.textContent =
    "Video " + (current + 1) +
    " / " + playlist.length;

  try {
    await player.play();
    start.hidden = true;
  } catch (e) {
    start.hidden = false;
    status.textContent += " - Play klicken";
  }
}

player.addEventListener("ended", () => {
  current = (current + 1) % playlist.length;
  playCurrent();
});

start.addEventListener("click", () => {
  player.play().then(() => {
    start.hidden = true;
  }).catch(() => {});
});

playCurrent();
</script>

</body>
</html>

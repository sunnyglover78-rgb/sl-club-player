
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}
video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}
#status {
    position: fixed;
    bottom: 10px;
    left: 10px;
    color: white;
    font: 16px Arial;
}
</style>
</head>
<body>

<video id="player"
       autoplay muted loop playsinline controls>
</video>

<div id="status">Video wird geladen...</div>

<script>
const video = document.getElementById("player");
const status = document.getElementById("status");

video.src =
"https://raw.githubusercontent.com/sunnyglover78-rgb/sl-club-player/main/NACHTWERK_Industrial_20s_Pulsierend.mp4";

video.addEventListener("playing", () => {
    status.textContent = "";
});

video.addEventListener("error", () => {
    status.textContent =
        "Fehler beim Laden des Videos: " +
        (video.error ? video.error.code : "unbekannt");
});

video.play().catch(() => {
    status.textContent =
        "Bitte Wiedergabetaste drücken.";
});
</script>

</body>
</html>

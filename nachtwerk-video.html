
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NACHTWERK Video</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

video {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
}
</style>
</head>

<body>
<video id="player"
       autoplay
       muted
       loop
       playsinline
       preload="auto">

    <source
      src="NACHTWERK_Industrial_20s_H264.mp4"
      type="video/mp4">

</video>

<script>
const player = document.getElementById("player");

player.muted = true;

player.play().catch(() => {
    console.log("Autoplay nicht möglich");
});
</script>
</body>
</html>
